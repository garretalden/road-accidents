[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "road-accidents"
version = "0.1.0"
description = "Predicting UK road accident severity from pre-crash features"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "imbalanced-learn>=0.12",
    "shap>=0.46",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "duckdb>=1.1",
    "pyarrow>=17",
    "joblib>=1.4",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyterlab>=4",
    "ruff>=0.6",
    "kaggle>=1.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
