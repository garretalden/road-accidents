[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "road-accident-severity"
version = "0.2.0"
description = "Leakage-safe UK road accident severity modeling and error analysis"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.3",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "imbalanced-learn>=0.12",
    "shap>=0.46",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyarrow>=17",
    "joblib>=1.4",
    "streamlit>=1.38",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "jupyterlab>=4",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
